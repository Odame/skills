[project]
name = "plainspeak"
version = "0.1.0"
description = "PostToolUse hook that blocks banned jargon and warns on uncommon words, hard-to-read sentences, and idioms on Write/Edit"
requires-python = ">=3.11"
dependencies = ["wordfreq>=3.1.1", "textstat>=0.7.4", "tomlkit>=0.13.0"]

[project.scripts]
plainspeak = "plainspeak.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plainspeak"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
